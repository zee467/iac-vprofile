name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main  # from stage → main (for approval)
    paths:
      - terraform/**
env:
  # Credentials for deploymebt to AWS
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # S3 bucket used for storing Terraform state files
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: kitops-eks
jobs:
  terraform:
    name: "Apply terraform code changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform  # Execute commands inside the terraform/ directory.
    steps:
      - name: Checkout source code  # Fetches the repository code into the workflow runner.
        uses: actions/checkout@v4
      - name: Setup Terraform with specified version on the runner  # Installs Terraform on the GitHub runner.
        uses: hashicorp/setup-terraform@v2
      - name: Terraform init  # Initializes the Terraform backend (your S3 bucket).
        id: init
        run: terraform init backend-config="bucket=$BUCKET_TF_STATE"
      - name: Terraform format
        id: fmt
        run: terraform fmt -check
      - name: Terraform validate
        id: validate
        run: terraform validate
      - name: Terraform plan  # shows the potential changes without applying them
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true
      - name: Terraform plan status
        if: ${{ steps.plan.outcome == 'failure' }}
        run: exit 1 
